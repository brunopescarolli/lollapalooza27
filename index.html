<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Table Lolla 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-content">
    <h1>Monte seu Lolla</h1>
    <p>Clique nos blocos para adicionar ao seu roteiro. Blocos vermelhos indicam conflito!</p>
    <div id="tabs" class="tabs"></div>
    <button id="btn-download" class="download-btn">Baixar Grade em Imagem</button>
  </div>
</header>

<main id="schedule-wrapper" class="schedule-scroll">
  <div class="schedule-inner" id="print-area">
    
    <div class="stage-headers" id="stage-headers">
      <div class="time-col-header"></div>
    </div>

    <div class="schedule-grid" id="schedule-grid">
      <div class="abertura-portoes">11H - ABERTURA DOS PORTÕES</div>
      <div id="hour-lines"></div>
      <div id="stage-columns" class="stage-columns"></div>
    </div>

  </div>
</main>

<script src="schedule_data.js"></script>
<script src="app.js"></script>
</body>
</html>
