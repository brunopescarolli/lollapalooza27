<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Lolla 2027 no Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
:root{--red:#ff5a3c;--cyan:#38c6ea;--lime:#d8f236;--lilac:#a9a6f2;--ink:#141414;--paper:#fffdf5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Archivo Narrow',Arial Narrow,sans-serif;color:var(--ink);background:var(--cyan);min-height:100vh}
.poster{position:relative;max-width:760px;margin:0 auto;padding:28px 22px 40px;overflow:hidden;background:
 radial-gradient(circle at 12% 30%,var(--lilac) 0 22%,transparent 22.2%),
 linear-gradient(115deg,var(--cyan) 0 52%,var(--lime) 52.2% 100%)}
.poster::before{content:"15 15 15 15 15 15 15 15 15 15 15 15";position:absolute;top:0;left:0;right:0;height:64px;overflow:hidden;white-space:nowrap;
 background:var(--red);font:700 54px/64px Anton,Impact,sans-serif;letter-spacing:6px;color:var(--ink);opacity:.9}
.content{position:relative;padding-top:78px}
h1{font:400 clamp(44px,11vw,84px)/.92 Anton,Impact,sans-serif;text-transform:uppercase;margin:0 0 8px;background:var(--ink);color:var(--paper);display:inline-block;padding:6px 14px 8px;transform:rotate(-1.5deg)}
.sub{font-weight:700;font-size:18px;margin:14px 0 22px;max-width:46ch}
#status{margin:16px 0 0;font-weight:700;min-height:24px}
#result{margin-top:22px}
#card{background:var(--paper);padding:20px 18px 14px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
#card h2{font:400 30px/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0 0 12px}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-top:2px solid var(--ink)}
.row .n{font:400 30px/1 Anton,Impact,sans-serif;color:var(--red)}
.row .a{font:400 clamp(24px,6.4vw,40px)/1 Anton,Impact,sans-serif;text-transform:uppercase;overflow-wrap:anywhere}
.row .h{font:400 clamp(20px,5vw,30px)/1 Anton,Impact,sans-serif;text-align:right;white-space:nowrap}
.row .h span{font:700 14px 'Archivo Narrow',sans-serif;display:block;opacity:.7}
.foot{margin-top:12px;font-size:14px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px}
button{margin-top:16px;font:400 22px Anton,Impact,sans-serif;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:12px 22px;cursor:pointer}
button:hover,button:focus-visible{background:var(--red);outline:3px solid var(--ink)}
#periods{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:18px}#periods label{background:var(--paper);padding:6px 12px;border:2px solid var(--ink);cursor:pointer}#periods label:has(input:checked){background:var(--lime)}
.priv{font-size:14px;margin-top:22px;font-weight:500}
</style>
</head>
<body>
<main class="poster"><div class="content">
<h1>Seu Lolla<br>no Spotify</h1>
<p class="sub">Lollapalooza Brasil, 19, 20 e 21 de março de 2027. Entre com o Spotify e veja quais artistas do line-up estão no topo do seu top 50.</p>

<button id="login" type="button">Entrar com Spotify</button>
<div id="periods" hidden>
  <label><input type="radio" name="tr" value="short_term"> Último mês</label>
  <label><input type="radio" name="tr" value="medium_term"> 6 meses</label>
  <label><input type="radio" name="tr" value="long_term" checked> 1 ano</label>
</div>

<div id="status" role="status" aria-live="polite"></div>
<div id="result" hidden>
  <div id="card"><h2>Meu top 10 do Lolla 2027</h2><div id="rows"></div><div class="foot" id="foot"></div></div>
  <button id="save" type="button">Baixar imagem</button>
</div>
<p class="priv">O login usa só a permissão de ler seus artistas mais ouvidos. Nada é enviado para servidor nenhum.</p>
</div></main>

<script>
// Line-up transcrito do cartaz. "a" = nomes alternativos como aparecem no Spotify.
const LINEUP=[
"Travis Scott","Charli XCX","The Killers","David Guetta","Queens of the Stone Age","The Neighbourhood","Fontaines D.C.","The Prodigy","SOMBR","Mochakk",
"Dominic Fike","Malcolm Todd","RAYE","Geese","Cage The Elephant","Lola Young","Slayyyter","Adéla","Marlon Hoffstadt","Four Tet","Tomora",
"Leon Bridges","Rodrigo Amarante","Mike D 5D","Boys Noize","Angine de Poitrine","Sammy Virji","Snow Strippers","Julia Wolf","Ninajirachi",
{n:"Criolo, Amaro e Dino",a:["Criolo","Amaro Freitas","Dino D'Santiago"]},"Die Spitz","Cat Dealers","Nação Zumbi","Midnight Generation","Carlita",
"The Avalanches","Violet Grohl","Boy Harsher","Brime!!","Mind Enterprises","Fezzo","Majis","Santos Bravos","Clementaum","Rawayana",
{n:"Carola & Curol",a:["Carola","Curol"]},"Fernanda Martins","Budang","Weird Baile","Grag Queen","Luana Flores","Buhr","Make U Sweat",
"Zepelim e o Sopro do Cão","Bebé","Acid Asian","Seu Pereira e Coletivo 401","Catïça","Real No Ficcíon","DJ Ramemes","Marina Diniz",
"Mary Olivetti","El Efecto","Psilosamples","Rakta","Deafkids","Kenya20Hz","Paira","Núbia","Clarissa","Cíça Moreira","Joaquim","DJ Tamy"
].map(x=>typeof x==="string"?{n:x,a:[x]}:x);

const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const INDEX=new Map();
LINEUP.forEach(it=>[it.n,...it.a].forEach(k=>INDEX.set(norm(k),it)));

const CLIENT_ID="COLE_SEU_CLIENT_ID_AQUI";
const REDIRECT=location.origin+location.pathname;
const $=id=>document.getElementById(id),status=$("status"),say=t=>status.textContent=t;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function login(){
  const verifier=b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  sessionStorage.setItem("pkce",verifier);
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:"user-top-read",code_challenge_method:"S256",code_challenge:challenge});
}
async function token(code){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem("pkce")})});
  if(!r.ok)throw new Error("falha ao autenticar ("+r.status+")");
  return (await r.json()).access_token;
}
let TOKEN=null;
async function load(range){
  say("Buscando seus artistas…");
  const r=await fetch("https://api.spotify.com/v1/me/top/artists?limit=50&time_range="+range,{headers:{Authorization:"Bearer "+TOKEN}});
  if(r.status===403){say("Acesso negado. Seu e-mail precisa estar cadastrado como usuário do app no dashboard do Spotify.");return}
  if(!r.ok){say("Erro da API do Spotify ("+r.status+").");return}
  const items=(await r.json()).items;
  const seen=new Set(),top=[];
  items.forEach((ar,i)=>{const it=INDEX.get(norm(ar.name));if(it&&!seen.has(it)){seen.add(it);top.push([it,i+1])}});
  if(!top.length){$("result").hidden=true;say("Nenhum artista do line-up apareceu no seu top 50 desse período. Tente outro período.");return}
  const t10=top.slice(0,10);
  $("rows").innerHTML=t10.map(([it,p],i)=>`<div class="row"><div class="n">${i+1}</div><div class="a"></div><div class="h">#${p}<span>no seu top 50</span></div></div>`).join("");
  [...document.querySelectorAll("#rows .a")].forEach((el,i)=>el.textContent=t10[i][0].n);
  $("foot").textContent=`${top.length} artistas do line-up no seu top 50`;
  $("result").hidden=false;say("");
}
$("login").addEventListener("click",login);
document.querySelectorAll('input[name=tr]').forEach(i=>i.addEventListener("change",e=>load(e.target.value)));
$("save").addEventListener("click",async()=>{
  const url=await htmlToImage.toPng($("card"),{pixelRatio:2,backgroundColor:"#fffdf5"});
  const a=document.createElement("a");a.href=url;a.download="meu-lolla-2027.png";a.click();
});
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("error")){say("Login cancelado.");return}
  if(p.get("code")){
    history.replaceState({},"",REDIRECT);$("login").hidden=true;
    try{TOKEN=await token(p.get("code"));$("periods").hidden=false;await load("long_term")}catch(e){say("Erro: "+e.message);$("login").hidden=false}
  }
})();
</script>
</body>
</html>
